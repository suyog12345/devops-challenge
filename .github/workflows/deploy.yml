name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-challenge:${{ github.sha }} ./app

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-challenge:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy with Helm
        run: helm upgrade --install devops-challenge ./helm/devops-challenge --namespace devops-helm --create-namespace --set backend.image.tag=${{ github.sha }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend -n devops-helm
          kubectl rollout status deployment/postgres -n devops-helm
          kubectl get pods -n devops-helm
          kubectl get svc -n devops-helm
          kubectl get pvc -n devops-helm